name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, web build, expo-doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run web:build
      - run: npx expo-doctor

  e2e:
    name: Browser E2E (production web build, desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  edge-functions:
    name: Edge Functions (deno check + test)
    runs-on: ubuntu-latest
    env:
      # The functions resolve npm: specifiers themselves; the app's package.json must not apply.
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check each function
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "deno check $f"
            deno check "$f"
          done
      - run: deno test supabase/functions/

  database:
    name: PostgreSQL migrations, constraints and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db -- --ci

  lockfile-align:
    name: Temporary Expo lockfile diff
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/codex-review-recovery-backup-media'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit changed lockfile fields (no credentials)
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 }));
          const after = require('./package-lock.json');
          function visit(a, b, path = []) {
            if (JSON.stringify(a) === JSON.stringify(b)) return;
            if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
              for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) visit(a[key], b[key], [...path, key]);
            } else {
              console.log('LOCK_PATCH:' + JSON.stringify({ path, deleted: b === undefined, value: b === undefined ? null : b }));
            }
          }
          visit(before, after);
          NODE
