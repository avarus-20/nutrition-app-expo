# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the Supabase dashboard; see docs/DEPLOYMENT.md.
project_id = "nutrition-app-expo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["nutritiontracker://", "http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.transcribe]
verify_jwt = true

[functions.estimate-photo]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
